name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # download the size artifacts of the latest dev run

jobs:
  build:
    name: ${{ matrix.env }} / ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [GD32F130C6, GD32F130C8, STM32F103C6, STM32F103C8]
        # Flags are appended to [features] in platformio.ini (-U removes a default)
        config:
          - name: default
            flags: ""
          - name: none
            flags: "-UDEBUG_RTT -UHOVER_SERIAL"
          - name: serial-test
            flags: "-DTEST"
          - name: serial-remote-nodebug
            flags: "-UDEBUG_RTT -DREMOTE"
          - name: remote-no-serial
            flags: "-UHOVER_SERIAL -DREMOTE"
          - name: mpu6050-ahrs-nodebug
            flags: "-UDEBUG_RTT -DMPU6050 -DAHRS"
          - name: icm20948-ahrs
            flags: "-DICM20948 -DAHRS"
          - name: all
            flags: "-DREMOTE -DMPU6050 -DAHRS"
    env:
      PLATFORMIO_BUILD_FLAGS: ${{ matrix.config.flags }} -Wl,-Map,.pio/build/${{ matrix.env }}/firmware.map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Size report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: sizes-${{ matrix.env }}-${{ matrix.config.name }}
        run: |
          map=.pio/build/${{ matrix.env }}/firmware.map
          [ -f "$map" ] || { echo "no map file"; exit 0; }
          # Base: same build in the latest completed run on dev (may be missing)
          base_run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch dev --event push \
                     --status completed --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          [ -n "$base_run" ] && gh run download "$base_run" -R "$GITHUB_REPOSITORY" -n "$NAME" -D base || true
          mkdir -p sizes
          python3 tools/size_report.py "$map" "${{ matrix.env }} / ${{ matrix.config.name }}" \
            --json "sizes/$NAME.json" --base "base/$NAME.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sizes-${{ matrix.env }}-${{ matrix.config.name }}
          path: sizes/
          if-no-files-found: ignore
          retention-days: 90

  size-summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sizes-*
          path: cur
      - name: Summary vs dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch dev --event push \
                     --status completed --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          [ -n "$base_run" ] && gh run download "$base_run" -R "$GITHUB_REPOSITORY" -p 'sizes-*' -D base || true
          echo "Base: dev run ${base_run:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/size_report.py --summary cur --base-dir base | tee -a "$GITHUB_STEP_SUMMARY"
